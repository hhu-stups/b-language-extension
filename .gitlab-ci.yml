default:
  image: node:20
  before_script:
    - npm install

test:
  stage: test
  script:
    - npm run-script download_jar
    - npm run-script package
  artifacts:
    expire_in: 1 week
    paths:
      - b-language-extension-*.vsix
  cache:
    paths:
      - node_modules

deploy:snapshot:
  stage: deploy
  only:
    - develop@general/stups/b_language_extension
  image: alpine:3
  before_script:
    - apk update
    - apk add lftp openssh-client
  script: LFTP_PASSWORD="${DEPLOY_PASSWORD}" lftp -c "set cmd:fail-exit true; set sftp:auto-confirm true; open --user ${DEPLOY_USERNAME} --env-password sftp://${DEPLOY_HOST}/${DEPLOY_REMOTE_BASEDIR}/downloads/vscode_plugin/snapshot/; mput -e b-language-extension-*.vsix"

deploy:release:
  stage: deploy
  only:
    - release@general/stups/b_language_extension
  needs:
    - test
  image: alpine:3
  before_script:
    - apk update
    - apk add lftp openssh-client
  script:
    - npm exec -- vsce publish --packagePath b-language-extension-*.vsix
    # token given by OVSX_PAT
    - npm exec -- ovsx publish b-language-extension-*.vsix
    - LFTP_PASSWORD="${DEPLOY_PASSWORD}" lftp -c "set cmd:fail-exit true; set sftp:auto-confirm true; open --user ${DEPLOY_USERNAME} --env-password sftp://${DEPLOY_HOST}/${DEPLOY_REMOTE_BASEDIR}/downloads/vscode_plugin/; mput -e b-language-extension-*.vsix"
